# On-policy distillation training configuration for Dream
training_mode: 'dream'

# Model and data path configuration
paths:
  model: 'Dream-org/Dream-v0-Base-7B'
  experiment: 'ckpt_dream_base_on_policy'
  data:
    bs: 'Lansechen/bs17k_collection_filtered_hard_maxlength600'
    bs_easy: 'Lansechen/bs17k_collection_filtered_easy_maxlength600'

denoiser:
  encoder:
    name: 'dream'
    mask_id: 151666

  decoder:
    wiinit: true
    name: 'eagle_rope'
    num_blocks: 1
    seq_len: &seq_len 1024
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  # Distillation mode: 'on-policy' or 'off-policy' (default)
  distillation_mode: 'on-policy'

  # On-policy specific parameters
  student_decode_steps: 2  # Number of steps student decodes in each block (n < block_size)
  teacher_rollout_steps: 4  # Number of steps teacher rolls out (m)
  temperature: 0.8  # Sampling temperature for on-policy rollout
  top_p: 0.95  # Top-p sampling for on-policy rollout

  # Will use paths.experiment path
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name 'ddt_on_policy'
  wandb_proj: *exp_name
  output_dir: 'ddt_on_policy'
  logging_dir: 'logs'
  mixed_precision: 'fp16'
  gradient_accumulation_steps: 5
  report_to: 'wandb'
  block_size: 16

  lr: 5e-6
  num_iters: 50000
  eval_every: 100000
  save_every: 1000

  enable_shift: true
  share_steps: 2
  self_align: true
  feature_align: false
  self_step: true

data:
  name: 'bs17k'
  batch_size: 1
  max_length: *seq_len