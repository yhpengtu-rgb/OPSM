# On-Policy Distillation CPU Test Configuration
# This config uses a small test dataset for CPU testing

experiment_name: "d2f-on-policy-cpu-test"

# Distillation mode
distillation:
  mode: "on_policy"  # Change to "on_policy" for on-policy distillation
  student_decode_steps: 1  # Number of steps student decodes per block
  teacher_rollout_steps: 1  # Number of steps teacher rolls out after student

# Model configurations
model:
  # Student model (adapter-tuned)
  student:
    name: "D2F"
    pretrained_model: "models/d2f-base"
    adapter:
      enable: true
      type: "lora"
      r: 8
      lora_alpha: 16
      lora_dropout: 0.1
      
  # Teacher model (frozen)
  teacher:
    pretrained_model: "models/d2f-base"
    adapter:
      enable: false  # Teacher uses base weights only

# Denoiser (D2F) configurations
D2F:
  block_size: 32768
  enable_shift: true
  share_steps: false
  self_align: false
  feature_align: false
  self_step: false

# Data configurations
data:
  max_seq_length: 65536
  question_length: 1024
  
  # Use local test dataset
  paths:
    data:
      bs: "local_data/test_small_dataset"

# Training configurations for CPU testing
training:
  output_dir: "outputs/on_policy_cpu_test"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  num_train_epochs: 1
  max_steps: 5  # Only 5 steps for quick CPU test
  
  # Reduce sequence length for CPU testing
  max_seq_length: 2048
  question_length: 256
  
  # Logging
  logging_steps: 1
  save_steps: 100
  
  # Mixed precision disabled for CPU
  fp16: false
  bf16: false
  
  # Optimizer
  optim: "adamw_torch"
  
  # Gradient clipping
  max_grad_norm: 1.0