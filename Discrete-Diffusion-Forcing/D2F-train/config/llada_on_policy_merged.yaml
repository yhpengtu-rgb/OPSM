# Merged optimisation config: KV-cache (partial-sequence forward) +
# dynamic padding + padding-excluded loss + async dual-GPU rollout.
#
# All three acceleration techniques are active simultaneously:
#   * KV-cache      — on_policy_rollout.py slices the attention mask +
#                     subsequence per block (always on, no toggle).
#   * Dynamic pad   — data.py collate_fn_dynamic pads to the longest seq in
#                     the batch, rounded up to block_size (always on).
#   * Padding-excl. — loss.py uses ``length`` to drop pure-padding positions
#                     from the loss (always on, fed by dynamic padding).
#   * Async rollout — set ``async_rollout_device`` to a 2nd GPU to overlap
#                     batch t+1's rollout with batch t's train step. Leave
#                     empty / remove the key to run synchronously on one GPU.
training_mode: 'llada'

paths:
  model: "/home/cw/workspace/Discrete-Diffusion-Forcing-main/LLaDA-8B-Instruct"
  experiment: "ckpt_llada_instruct_on_policy_merged"
  data:
    bs: "Lansechen/bs17k_collection_filtered_hard_maxlength600"
    bs_easy: "Lansechen/bs17k_collection_filtered_easy_maxlength600"

denoiser:
  encoder:
    name: "llada"
    mask_id: 126336

  decoder:
    wiinit: true
    name: "eagle_rope"
    num_blocks: 1
    seq_len: &seq_len 128
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  distillation_mode: "on-policy"
  student_decode_steps: 1
  teacher_rollout_steps: 1
  temperature: 0.8
  top_p: 0.95
  async_rollout_device: "cuda:1"   # dedicated rollout GPU; leave empty for sync
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name "llada_ddt_on_policy_merged"
  wandb_proj: *exp_name
  output_dir: "ddt_on_policy_merged"
  logging_dir: "logs"
  mixed_precision: "fp16"
  gradient_accumulation_steps: 2
  report_to: "no"
  block_size: 16
  lr: 1e-5
  num_iters: 3          # iteration cap (stops mid-epoch once reached)
  num_epochs:           # epoch-based: if set, stops after N full epochs
  eval_every: 100000
  save_every: 100000
  enable_shift: true
  share_steps: 2
  self_align: true
  feature_align: false
  self_step: true

data:
  name: "bs17k"
  batch_size: 1          # dynamic padding + gradient_accumulation for effective bs
  max_length: *seq_len
