# Per-hard-transition Concrete Score Matching on on-policy LLaDA rollouts.
# This preserves llada_on_policy_dmd.yaml's legacy final-successor DMD mode.
training_mode: 'llada'

paths:
  model: "/inspire/ssd/project/sais-bio/public/tupeng/Discrete-Diffusion-Forcing-main/LLaDA-8B-Instruct"
  experiment: "ckpt_llada_instruct_on_policy_transition_csm"
  data:
    bs: "/inspire/ssd/project/sais-bio/public/tupeng/Lansechen/bs17k_collection_filtered_hard_maxlength600"
    bs_easy: "/inspire/ssd/project/sais-bio/public/tupeng/Lansechen/bs17k_collection_filtered_easy_maxlength600"

denoiser:
  encoder:
    name: "llada"
    mask_id: 126336
  decoder:
    wiinit: true
    name: "eagle_rope"
    num_blocks: 1
    seq_len: &seq_len 1024
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  distillation_mode: "on-policy"
  # Full-draft low-confidence remask Concrete Score Matching.
  transition_csm: false
  macro_remask_csm: true
  macro_remask_ratio: 0.25
  # full_draft uses the student draft as x_s; teacher_corrected is optional.
  macro_remask_successor: full_draft
  macro_remask_gt_ce_weight: 0.1
  dmd_loss: false
  dmd_ema_decay: 0.999
  aux_remaining_weight: 0.0
  # Optional low-frequency EMA gradient-norm balancing for auxiliary CE.
  adaptive_weighting: false
  adaptive_weight_probe_every: 100
  adaptive_weight_ema_decay: 0.9
  adaptive_weight_target_ce_ratio: 0.3
  adaptive_weight_update_rate: 0.1
  adaptive_weight_min: 0.01
  adaptive_weight_max: 10.0
  # Decode each block fully before constructing the macro transition.
  student_decode_steps: 16
  teacher_rollout_steps: 1
  temperature: 0.0
  top_p: 1.0
  async_rollout_device:
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name "llada_ddt_on_policy_transition_csm"
  wandb_proj: *exp_name
  output_dir: "ddt_on_policy_transition_csm"
  logging_dir: "logs"
  mixed_precision: "fp16"
  gradient_accumulation_steps: 2
  report_to: "no"
  block_size: 16
  lr: 1e-5
  # num_iters: 50000
  num_epochs: 3
  eval_every: 100000
  save_every: 1000
  enable_shift: true
  share_steps: 2
  self_align: true
  feature_align: false
  self_step: true

data:
  name: "bs17k"
  num_workers: 4
  batch_size: 4
  max_length: *seq_len
